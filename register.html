<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TIB VA DAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --black:#0a0a0a;--white:#fff;
      --g50:#f7f7f7;--g100:#efefef;--g200:#e0e0e0;--g400:#a0a0a0;--g600:#666;
      --green:#00b37a;--green-bg:#e6f8f3;--red:#e03030;--red-bg:#fef0f0;
      --amber:#d97706;--f:'Manrope',-apple-system,sans-serif;
    }
    html,body{font-family:var(--f);background:var(--white);color:var(--black);min-height:100vh;-webkit-font-smoothing:antialiased;}
    .wrap{max-width:420px;margin:0 auto;padding:0 20px 60px;}

    /* Header */
    .header{padding:22px 20px 14px;border-bottom:1px solid var(--g200);margin:0 -20px 24px;}
    .logo{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;}
    .logo span{background:linear-gradient(135deg,#b8860b,#d4a017);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .tagline{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--g400);font-weight:600;margin-top:2px;}

    /* Steps */
    .steps{display:flex;gap:6px;margin-bottom:26px;}
    .step{flex:1;height:3px;background:var(--g100);border-radius:2px;transition:background .3s;}
    .step.done{background:var(--green);}
    .step.active{background:var(--black);}

    /* Screen */
    .screen{display:none;animation:up .2s ease both;}
    .screen.active{display:block;}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* Typography */
    .title{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;}
    .subtitle{font-size:.86rem;color:var(--g600);margin-bottom:22px;line-height:1.5;}

    /* Field */
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g600);margin-bottom:7px;}
    .field input{
      width:100%!important;display:block!important;
      background:var(--g50)!important;border:1.5px solid var(--g200)!important;
      border-radius:12px!important;padding:14px 16px!important;
      font-family:var(--f)!important;font-size:16px!important;font-weight:500!important;
      color:#0a0a0a!important;-webkit-text-fill-color:#0a0a0a!important;
      outline:none!important;-webkit-appearance:none!important;appearance:none!important;
      opacity:1!important;transition:border-color .15s;
    }
    .field input:focus{border-color:var(--black)!important;background:var(--white)!important;}
    .field input::placeholder{color:#b8b8b8!important;-webkit-text-fill-color:#b8b8b8!important;font-weight:400!important;opacity:1!important;}

    /* OTP */
    .otp-wrap{display:flex;gap:8px;margin-bottom:4px;}
    .otp-d{
      flex:1;height:58px;text-align:center!important;font-size:1.5rem!important;
      font-weight:800!important;border-radius:12px!important;padding:0!important;
      background:var(--g50)!important;border:1.5px solid var(--g200)!important;
      color:#0a0a0a!important;-webkit-text-fill-color:#0a0a0a!important;
      outline:none!important;-webkit-appearance:none!important;
      font-family:var(--f)!important;opacity:1!important;
    }
    .otp-d:focus{border-color:var(--black)!important;background:var(--white)!important;}

    /* Buttons */
    .btn{
      display:block;width:100%;padding:16px;
      border:none;border-radius:12px;
      font-family:var(--f);font-size:.95rem;font-weight:700;
      cursor:pointer;text-align:center;
      transition:opacity .15s,transform .1s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:scale(.97);opacity:.85;}
    .btn:disabled{opacity:.4;pointer-events:none;}
    .btn+.btn{margin-top:8px;}
    .btn-black{background:var(--black);color:var(--white);}
    .btn-outline{background:var(--white);color:var(--black);border:1.5px solid var(--g200);}

    /* Notice */
    .notice{border-radius:10px;padding:12px 14px;font-size:.84rem;line-height:1.55;font-weight:500;margin-bottom:14px;}
    .n-info {background:var(--green-bg);color:#006b50;border:1px solid #a0dcc8;}
    .n-error{background:var(--red-bg);color:var(--red);border:1px solid #f0c0c0;display:none;}
    .n-warn {background:#fff8ec;color:#9a5800;border:1px solid #fad890;}
    .n-code {background:#fff3cd;border:1.5px solid #ffc107;border-radius:10px;padding:14px 16px;font-size:1rem;font-weight:700;text-align:center;color:#333;letter-spacing:.05em;display:none;margin-bottom:14px;}

    /* Phone badge */
    .phone-badge{
      display:flex;align-items:center;gap:8px;
      background:var(--g50);border:1.5px solid var(--g200);
      border-radius:10px;padding:12px 14px;
      font-size:.88rem;font-weight:600;color:var(--black);
      margin-bottom:20px;
    }
    .phone-change{margin-left:auto;font-size:.78rem;color:var(--g400);cursor:pointer;font-weight:500;}

    /* Timer */
    .timer{text-align:center;font-size:.82rem;color:var(--g400);font-weight:500;margin-top:12px;}
    .timer a{color:var(--black);font-weight:600;cursor:pointer;}
    .timer a.off{color:var(--g400);pointer-events:none;}

    /* Success */
    .success-circle{width:64px;height:64px;background:var(--black);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
    .s-title{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:8px;}
    .s-sub{font-size:.86rem;color:var(--g600);text-align:center;margin-bottom:24px;}

    /* Welcome (eski foydalanuvchi) */
    .welcome-card{
      background:var(--g50);border:1.5px solid var(--g200);
      border-radius:16px;padding:20px;margin-bottom:16px;
    }
    .welcome-name{font-size:1.2rem;font-weight:800;color:var(--black);margin-bottom:4px;}
    .welcome-info{font-size:.84rem;color:var(--g600);}
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">TIB <span>VA DAM</span></div>
    <div class="tagline">Ruhiy Salomatlikni Aniqlash Platformasi</div>
  </div>

  <div class="steps">
    <div class="step active" id="step-1"></div>
    <div class="step" id="step-2"></div>
    <div class="step" id="step-3"></div>
  </div>

  <!-- 1. TELEFON -->
  <div class="screen active" id="sc-phone">
    <div class="title">Telefon raqam</div>
    <div class="subtitle">Davom etish uchun telefon raqamingizni kiriting</div>
    <div class="field">
      <label>Telefon raqam</label>
      <input id="inp-phone" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
    </div>
    <div class="notice n-error" id="phone-err"></div>
    <button class="btn btn-black" id="btn-send">Davom etish →</button>
  </div>

  <!-- 3a. YANGI FOYDALANUVCHI — ma'lumotlar -->
  <div class="screen" id="sc-info">
    <div class="title">Ma'lumotlarni kiriting</div>
    <div class="subtitle">Bir marta to'ldiriladi</div>
    <div class="field">
      <label>Ism va familiya</label>
      <input id="inp-name" type="text" placeholder="Alisher Navoiy" autocomplete="name">
    </div>
    <div class="field">
      <label>Yosh</label>
      <input id="inp-age" type="number" placeholder="28" min="5" max="120">
    </div>
    <div class="field">
      <label>Viloyat / Shahar</label>
      <input id="inp-region" type="text" placeholder="Toshkent">
    </div>
    <div class="notice n-error" id="info-err" style="margin-top:0"></div>
    <button class="btn btn-black" id="btn-register">Ro'yxatdan o'tish →</button>
  </div>

  <!-- 3b. ESKI FOYDALANUVCHI — xush kelibsiz -->
  <div class="screen" id="sc-welcome">
    <div style="padding-top:16px">
      <div class="welcome-card" id="welcome-card">
        <div class="welcome-name" id="welcome-name"></div>
        <div class="welcome-info" id="welcome-info"></div>
      </div>
      <div class="notice n-info">✅ Telefon raqamingiz tasdiqlandi</div>
      <button class="btn btn-black" id="btn-enter">Kirish →</button>
    </div>
  </div>

  <!-- 4. SUCCESS (yangi ro'yxatdan o'tgan) -->
  <div class="screen" id="sc-success">
    <div style="padding-top:32px">
      <div class="success-circle">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <polyline points="5,14 11,20 23,8" stroke="white" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="s-title">Xush kelibsiz!</div>
      <div class="s-sub" id="success-sub"></div>
      <div class="notice n-info" style="text-align:center">✅ Ma'lumotlaringiz saqlandi</div>
      <button class="btn btn-black" id="btn-go">Davom etish →</button>
    </div>
  </div>
</div>

<script>
const API = "https://ruhiyat-production.up.railway.app";
let phone = '';

// ── Screens ──────────────────────────────────────────────────────────────────
function goScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
  const map = {'sc-phone':0,'sc-info':1,'sc-welcome':1,'sc-success':2};
  const idx = map[id] ?? 0;
  ['step-1','step-2','step-3'].forEach((s,i) => {
    const el = document.getElementById(s);
    el.className = 'step' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });
}

function showErr(id, msg) {
  const e = document.getElementById(id);
  if (!e) return;
  e.textContent = msg; e.style.display = 'block';
  setTimeout(() => e.style.display = 'none', 4000);
}

async function api(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  return r.json();
}

// ── Saqlab qo'yish ────────────────────────────────────────────────────────────
function saveUser(user) {
  try {
    const p = user.phone || phone || '';
    localStorage.setItem('tvd_phone', p);
    localStorage.setItem('tvd_name', user.full_name || '');
    localStorage.setItem('tvd_user', JSON.stringify({...user, phone: p}));
    console.log('[register] Saved user:', user.full_name, 'phone:', p);
  } catch(e) {
    console.error('[register] localStorage error:', e);
  }
}

function goApp() {
  window.location.href = 'index.html';
}

// ── STEP 1: Telefon (OTP-siz) ───────────────────────────────────────────────
document.getElementById('btn-send').addEventListener('click', async () => {
  const val = document.getElementById('inp-phone').value.trim();
  if (!val || val.length < 9) return showErr('phone-err', "Telefon raqamni to'g'ri kiriting");

  const btn = document.getElementById('btn-send');
  btn.disabled = true; btn.textContent = 'Tekshirilmoqda...';

  try {
    phone = val;
    // Telefon bo'yicha foydalanuvchi bor-yo'qligini tekshiramiz (tasdiqlash kodisiz)
    const res = await api('/api/check-user', {phone: val});

    if (res && res.ok && res.exists && res.user) {
      // Eski foydalanuvchi — to'g'ridan-to'g'ri kirish
      const u = res.user;
      document.getElementById('welcome-name').textContent = u.full_name || '';
      document.getElementById('welcome-info').textContent =
        `${u.age || ''} yosh · ${u.region || ''}`;
      saveUser({...u, phone: val});
      goScreen('sc-welcome');
    } else {
      // Yangi foydalanuvchi — ma'lumot to'ldirish
      goScreen('sc-info');
    }
  } catch(e) {
    showErr('phone-err', "Server bilan aloqa yo'q. Qayta urinib ko'ring.");
  }
  btn.disabled = false; btn.textContent = 'Davom etish →';
});

// ── Eski foydalanuvchi kirishi ────────────────────────────────────────────────
document.getElementById('btn-enter').addEventListener('click', goApp);

// ── STEP 3: Register ──────────────────────────────────────────────────────────
document.getElementById('btn-register').addEventListener('click', async () => {
  const name   = document.getElementById('inp-name').value.trim();
  const age    = document.getElementById('inp-age').value.trim();
  const region = document.getElementById('inp-region').value.trim();

  if (!name || name.length < 3) return showErr('info-err', "Ism kamida 3 ta harf bo'lsin");
  if (!age || isNaN(+age) || +age < 5 || +age > 120) return showErr('info-err', "Yoshni to'g'ri kiriting");
  if (!region) return showErr('info-err', 'Viloyatni kiriting');

  const btn = document.getElementById('btn-register');
  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';

  try {
    const res = await api('/api/otp/register', {
      phone, full_name: name, age: +age, region,
    });

    if (!res?.ok) {
      showErr('info-err', res?.detail || "Ro'yxatdan o'tishda xatolik");
      btn.disabled = false; btn.textContent = "Ro'yxatdan o'tish →";
      return;
    }

    saveUser({...res.user, phone});
    document.getElementById('success-sub').textContent = `${name}, muvaffaqiyatli ro'yxatdan o'tdingiz!`;
    goScreen('sc-success');
  } catch(e) {
    showErr('info-err', "Server bilan aloqa yo'q.");
  }
  btn.disabled = false; btn.textContent = "Ro'yxatdan o'tish →";
});

// ── Success → App ─────────────────────────────────────────────────────────────
document.getElementById('btn-go').addEventListener('click', goApp);
</script>
</body>
</html>
